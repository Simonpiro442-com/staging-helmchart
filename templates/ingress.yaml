{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "fastapi-chart.fullname" . }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}

      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}

            backend:
              service:
                name: {{ include "fastapi-chart.fullname" $ }}

                port:
                  number: 80
          {{- end }}
    {{- end }}

{{- end }}